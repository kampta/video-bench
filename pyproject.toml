[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-bench"
version = "0.1.0"
description = "Standalone Qwen3.5 video-token fine-tuning benchmark for PyTorch and JAX"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.txt", "licenses/*.csv"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3", "huggingface-hub>=1,<2", "safetensors>=0.6",
  "transformers==5.5.4", "av>=15", "pillow>=11",
  "pyyaml>=6", "tqdm>=4", "requests>=2.32",
]

[project.optional-dependencies]
cuda = ["torch==2.10.0", "torchvision==0.25.0", "triton", "accelerate>=1.10", "fla-core==0.6.0", "tilelang==0.1.15; platform_machine == 'x86_64'", "liger-kernel==0.8.5", "causal-conv1d==1.7.0; platform_machine == 'x86_64'"]
jax = ["torch==2.8.0", "torchvision==0.23.0", "easydel==0.3.0", "jax==0.9.2", "optax>=0.2.6,<0.3"]
tpu = ["jax[tpu]; platform_machine == 'x86_64'"]

[tool.uv]
conflicts = [[{extra = "cuda"}, {extra = "jax"}]]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda-arm"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
causal-conv1d = {url = "https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0%2Bcu12torch2.10cxx11abiTRUE-cp312-cp312-linux_x86_64.whl", marker = "platform_machine == 'x86_64'"}
triton = {index = "pytorch-cuda-arm", marker = "platform_machine == 'aarch64'"}
torch = [
  {index = "pytorch-cuda", extra = "cuda", marker = "platform_machine == 'x86_64'"},
  {index = "pytorch-cuda-arm", extra = "cuda", marker = "platform_machine == 'aarch64'"},
  {index = "pytorch-cpu", extra = "jax"},
]
torchvision = [
  {index = "pytorch-cuda", extra = "cuda", marker = "platform_machine == 'x86_64'"},
  {index = "pytorch-cuda-arm", extra = "cuda", marker = "platform_machine == 'aarch64'"},
  {index = "pytorch-cpu", extra = "jax"},
]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["video_bench"]
